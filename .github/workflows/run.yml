name: DanLM vs Bot Eval (macOS, fixed)

# The upstream BaselineBotAgent does not add the bot's own directory to
# sys.path, so bot code relying on intra-package imports (e.g.
# "from lxw.trans import ...") fails silently inside evaluate().
# Fix: put the bot dir on PYTHONPATH ourselves (verified by diag v2).

on:
  workflow_dispatch:

jobs:
  eval-bot:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install torch numpy onnxruntime

      - name: Evaluate DanLM vs fin-njupt-guandan-ai (single round, 100 games)
        run: |
          PYTHONPATH=.:baselines/fin-njupt-guandan-ai python scripts/evaluate.py \
            --model ckpts/DanLM_v1/dansformer_v1_best_eval.pt \
            --model-b "bot:fin-njupt-guandan-ai" \
            --games 100 \
            --log-interval 10 | tee eval_vs_bot.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: eval-vs-bot-fixed
          path: eval_vs_bot.txt
          if-no-files-found: error
